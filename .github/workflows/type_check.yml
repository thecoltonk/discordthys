# Enforce zero type errors, using Pyright!
name: Type Checking

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install project dependencies
        run: uv sync --locked --dev
      - name: Run Pyright
        run: uv run pyright
