name: Tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: cs
          POSTGRES_DB: cs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cs -d cs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://cs:cs@localhost:5432/cs_test
        run: uv run pytest -q

  docker-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: cloudsail-support:ci
