[project]
name = "nephthys"
version = "1.0.0"
description = "Cloudsail Support: Discord support bot for #community-help (fork of hackclub/nephthys)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "apscheduler>=3.10.4,<4",
    "discord.py>=2.6.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "piccolo[postgres]>=1.33.0",
    "prometheus-client>=0.23.1",
    "pydantic>=2.11.5",
    "python-dotenv>=1.1.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
]

[project.scripts]
nephthys = "nephthys.__main__:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pyright>=1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.6",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["nephthys", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # discord.py internals on Python 3.13
    "ignore:'count' is passed as positional argument:DeprecationWarning",
]

[tool.ruff.lint]
# ignore root-logger-call
ignore = ["LOG015"]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false
