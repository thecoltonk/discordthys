repos:
  # Ruff handles import sorting too (force-single-line, see pyproject.toml).
  # reorder-python-imports was dropped: it fought with ruff-format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
